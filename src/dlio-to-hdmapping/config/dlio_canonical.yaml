# DLIO on the benchmark's canonical bag (see the orchestration README, "Canonical bag").
# DLIO's own cfg/dlio.yaml with only the sensor description changed: the IMU sits at the
# lidar origin (the bag's IMU is in the lidar frame). DLIO has no per-sensor config: it
# picks the sensor from the point fields (see the Dockerfile patch). cfg/params.yaml is
# loaded unchanged from upstream.
